{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>组合特征变化趋势图</h2>
    
    <!-- 组合特征预测卡片 -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">下一期组合特征预测</h5>
                    <div class="alert alert-info">
                        <h4>预测组合：{{ predicted_pattern }}</h4>
                    </div>
                    <h6>历史组合特征概率分布：</h6>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>组合特征</th>
                                    <th>出现概率</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for pattern, prob in pattern_probabilities.items() %}
                                <tr>
                                    <td>{{ pattern }}</td>
                                    <td>{{ "%.2f"|format(prob * 100) }}%</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <canvas id="sumChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <canvas id="evenChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <canvas id="primeChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const drawDates = {{ draw_dates|tojson }};
    const frontSums = {{ front_sums|tojson }};
    const backSums = {{ back_sums|tojson }};
    const frontEvens = {{ front_evens|tojson }};
    const backEvens = {{ back_evens|tojson }};
    const frontPrimes = {{ front_primes|tojson }};
    const backPrimes = {{ back_primes|tojson }};

    // 号码和趋势图
    new Chart(document.getElementById('sumChart'), {
        type: 'line',
        data: {
            labels: drawDates,
            datasets: [
                {
                    label: '前区号码和',
                    data: frontSums,
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                },
                {
                    label: '后区号码和',
                    data: backSums,
                    borderColor: 'rgb(255, 99, 132)',
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: '号码和趋势'
                }
            }
        }
    });

    // 偶数个数趋势图
    new Chart(document.getElementById('evenChart'), {
        type: 'line',
        data: {
            labels: drawDates,
            datasets: [
                {
                    label: '前区偶数个数',
                    data: frontEvens,
                    borderColor: 'rgb(54, 162, 235)',
                    tension: 0.1
                },
                {
                    label: '后区偶数个数',
                    data: backEvens,
                    borderColor: 'rgb(255, 159, 64)',
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: '偶数个数趋势'
                }
            }
        }
    });

    // 质数个数趋势图
    new Chart(document.getElementById('primeChart'), {
        type: 'line',
        data: {
            labels: drawDates,
            datasets: [
                {
                    label: '前区质数个数',
                    data: frontPrimes,
                    borderColor: 'rgb(153, 102, 255)',
                    tension: 0.1
                },
                {
                    label: '后区质数个数',
                    data: backPrimes,
                    borderColor: 'rgb(255, 205, 86)',
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: '质数个数趋势'
                }
            }
        }
    });
</script>
{% endblock %}
